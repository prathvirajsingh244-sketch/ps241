services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=MaargMitra
      - API_PREFIX=/api/v1
      - CORS_ORIGINS=*
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-flash-latest
    restart: unless-stopped
